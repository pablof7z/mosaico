[package]
name = "mosaico"
version = "0.1.2"
edition = "2021"
description = "Identity and awareness fabric for coding agents: durable, self-owned identity and live @mentions across Claude Code, Codex, Goose, Hermes, Kimi Code, OpenCode, Grok, and Pi."
license = "MIT"
keywords = ["agents", "coding-agents", "nostr", "nip29", "cli"]

[[bin]]
name = "mosaico"
path = "src/main.rs"

[lib]
name = "mosaico"
path = "src/lib.rs"

[[test]]
name = "bdd"
path = "bdd/main.rs"
harness = false

[dependencies]
# Nostr (must match fava's exact pin)
nostr = { version = "=0.45.3", default-features = false, features = ["std"] }

# Fava engine — NMP replacement
fava = { path = "/Users/pablofernandez/Work/fava/crates/fava" }
fava-simple-groups = { path = "/Users/pablofernandez/Work/fava/crates/fava-simple-groups" }
fava-event-cache-memory = { path = "/Users/pablofernandez/Work/fava/crates/fava-event-cache-memory" }
fava-write-store = { path = "/Users/pablofernandez/Work/fava/crates/fava-write-store" }
fava-write-store-redb = { path = "/Users/pablofernandez/Work/fava/crates/fava-write-store-redb" }
fava-write-store-memory = { path = "/Users/pablofernandez/Work/fava/crates/fava-write-store-memory" }
fava-query-standard = { path = "/Users/pablofernandez/Work/fava/crates/fava-query-standard" }
fava-subscriptions-no-grouping = { path = "/Users/pablofernandez/Work/fava/crates/fava-subscriptions-no-grouping" }
fava-transport-websocket = { path = "/Users/pablofernandez/Work/fava/crates/fava-transport-websocket" }
fava-publisher-nip01 = { path = "/Users/pablofernandez/Work/fava/crates/fava-publisher-nip01" }
fava-delivery-standard = { path = "/Users/pablofernandez/Work/fava/crates/fava-delivery-standard" }
fava-router-app-relays = { path = "/Users/pablofernandez/Work/fava/crates/fava-router-app-relays" }
fava-signer = { path = "/Users/pablofernandez/Work/fava/crates/fava-signer" }
fava-signer-local = { path = "/Users/pablofernandez/Work/fava/crates/fava-signer-local" }
fava-query = { path = "/Users/pablofernandez/Work/fava/crates/fava-query" }

# Blossom file-upload layer (no nostr types cross the boundary)
nmp-asset = { version = "=0.1.0", git = "https://github.com/pablof7z/nmp.git", rev = "b6f95ee725106fd404fe4904b071f8aee3197b09" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "process", "io-util", "io-std", "net", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
nix = { version = "0.29", features = ["signal", "process", "fs"] }
notify = "8"
libc = "0.2"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"
fuzzy-matcher = "0.3"
owo-colors = { version = "4", features = ["supports-colors"] }
rustls = { version = "0.23", features = ["ring"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
mime_guess = "2"
regex = "1"
ratatui = { version = "0.30.1", default-features = false, features = ["crossterm_0_28", "macros"] }
hmac = "0.12"
sha2 = "0.10"
shlex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
portable-pty = "0.9"
toml = "0.9"
unicode-width = "0.2"
url = "2"
tempfile = "3"

[dev-dependencies]
cucumber = "0.21"
redb = "4"
tempfile = "3"
tungstenite = "0.29"
