[package]
name = "mosaico"
version = "0.1.2"
edition = "2021"
description = "Identity and awareness fabric for coding agents: durable, self-owned identity and live @mentions across Claude Code, Codex, Goose, Hermes, Kimi Code, OpenCode, and Grok."
license = "MIT"
keywords = ["agents", "coding-agents", "nostr", "nip29", "cli"]

[[bin]]
name = "mosaico"
path = "src/main.rs"

[[bin]]
name = "nmp-subscription-stress"
path = "tools/nmp_subscription_stress/main.rs"
required-features = ["stress-harness"]

[lib]
name = "mosaico"
path = "src/lib.rs"

[features]
# Opt-in only: the stress binary reaches NMP's explicitly benchmark-gated
# reducer/store counters and pure router seam. Production never enables it.
stress-harness = [
    "dep:nmp-router",
    "dep:nmp-resolver",
    "dep:nmp-store",
    "dep:tempfile",
    "nmp/bench-instrumentation",
    "nmp-store/bench-instrumentation",
]

[[test]]
name = "bdd"
path = "bdd/main.rs"
harness = false

[dependencies]
nostr = "0.44.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "process", "io-util", "io-std", "net", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
nix = { version = "0.29", features = ["signal", "process", "fs"] }
notify = "8"
libc = "0.2"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"
fuzzy-matcher = "0.3"
owo-colors = { version = "4", features = ["supports-colors"] }
rustls = { version = "0.23", features = ["ring"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
mime_guess = "2"
nmp = { version = "=0.1.0", git = "https://github.com/pablof7z/nmp.git", rev = "bca64d75eeee8496b93ca220976c4fa6046cf6cb" }
nmp-grammar = { version = "=0.1.0", git = "https://github.com/pablof7z/nmp.git", rev = "bca64d75eeee8496b93ca220976c4fa6046cf6cb" }
nmp-resolver = { version = "=0.1.0", git = "https://github.com/pablof7z/nmp.git", rev = "bca64d75eeee8496b93ca220976c4fa6046cf6cb", optional = true }
nmp-router = { version = "=0.1.0", git = "https://github.com/pablof7z/nmp.git", rev = "bca64d75eeee8496b93ca220976c4fa6046cf6cb", optional = true }
nmp-store = { version = "=0.1.0", git = "https://github.com/pablof7z/nmp.git", rev = "bca64d75eeee8496b93ca220976c4fa6046cf6cb", optional = true }
nmp-network-policy = { version = "=0.1.0", git = "https://github.com/pablof7z/nmp.git", rev = "bca64d75eeee8496b93ca220976c4fa6046cf6cb" }
nmp-nip29 = { version = "=0.1.0", git = "https://github.com/pablof7z/nmp.git", rev = "bca64d75eeee8496b93ca220976c4fa6046cf6cb" }
nmp-asset = { version = "=0.1.0", git = "https://github.com/pablof7z/nmp.git", rev = "bca64d75eeee8496b93ca220976c4fa6046cf6cb" }
nmp-blossom = { version = "=0.1.0", git = "https://github.com/pablof7z/nmp.git", rev = "bca64d75eeee8496b93ca220976c4fa6046cf6cb" }
regex = "1"
ratatui = { version = "0.30.1", default-features = false, features = ["crossterm_0_28", "macros"] }
hmac = "0.12"
sha2 = "0.10"
shlex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
portable-pty = "0.9"
toml = "0.9"
unicode-width = "0.2"
url = "2"
tempfile = { version = "3", optional = true }

[dev-dependencies]
cucumber = "0.21"
# Writes the superseded-epoch store fixture the #920 falsifiers need. A store
# NMP refuses cannot be produced through NMP, and a byte blob only reproduces
# the damaged-bytes half — the half that must NOT be discarded.
redb = "4"
tempfile = "3"
tungstenite = "0.29"
